version: '3.8'

services:
  api:
    build:
      context: .
      target: builder
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/banking_db_local
      - JWT_SECRET=super_secret_local_dev_key_for_testing_only_123
      - JWT_EXPIRES_IN=4h
      - ALLOWED_ORIGINS=*
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=100
    volumes:
      - .:/usr/src/app
      # Avoid overriding node_modules inside container with local host node_modules
      - /usr/src/app/node_modules
    command: sh -c "node src/migrate.js && npm run dev"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=banking_db_local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d banking_db_local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
